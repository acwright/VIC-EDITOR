# Gate, build and publish the editor to GitHub Pages.
#
# Pages serves the site from /VIC-EDITOR/, so the build needs a matching base
# path; `vite.web.config.ts` reads it from VITE_BASE and falls back to `/` for
# local builds.
#
# This is the workflow that runs on `main`; ci.yml runs the same gates on a
# pull request, where there is nothing to deploy. The desktop artifacts are
# *not* built here — a signed, notarized dmg needs a macOS runner and Apple
# credentials (ELECTRON-PLAN §9). What runs here is the bundle-only smoke
# check, so a change that breaks the main or preload process fails on `main`
# rather than at the next release.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        name: Install
        env:
          # The Electron binary is 100 MB and is only needed to *run* the app.
          # Neither build below launches it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Lint without --fix: CI reports, it does not rewrite.
      - run: npx oxlint .
      - run: npx eslint .

      - run: npm run test:unit -- --run

      # Smoke check for the desktop build: main, preload and renderer all
      # bundle. Nothing downstream uses out/ — the deploy ships dist/web.
      - run: npx electron-vite build
        name: Build (Electron)

      # `npm run build` is the *Electron* build. Pages wants the standalone
      # renderer, which is a separate config and a separate output directory.
      - run: npm run build:web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Pages has no SPA fallback of its own; a copy of index.html at 404.html
      # is the conventional way to let deep links reach the router.
      - run: cp dist/web/index.html dist/web/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
